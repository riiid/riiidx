name: Release spec-fetcher bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/team/component/santa/spec-fetcher/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v1
        with:
          # ponytail: deno bundle는 2.0에서 제거됨. 1.x에 고정.
          deno-version: v1.x
      - name: Bundle
        run: >
          deno bundle --unstable
          src/team/component/santa/spec-fetcher/src/index.ts
          spec-fetcher.ts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag -l 'v0.0.*' | sort -V | tail -1)
          next="v0.0.$(( ${latest##*.} + 1 ))"
          gh release create "$next" spec-fetcher.ts \
            --target "$GITHUB_SHA" --title "$next" --generate-notes
